/* ══ MODAL INFORME ══════════════════════════════════════════════════════ */
function ModalInforme({movs, onClose}) {
  const [periodo, setPeriodo]   = React.useState('semana'); // dia | semana | mes
  const [filtro,  setFiltro]    = React.useState('todos');  // todos | ingreso | egreso
  const [detalles,setDetalles]  = React.useState(false);
  const [enviando,setEnviando]  = React.useState(false);

  const hoyDate = new Date();
  const hoyStr  = hoyDate.toISOString().slice(0,10);

  const getPeriodo = () => {
    if(periodo==='dia') {
      return {desde:hoyStr, hasta:hoyStr, label:'Hoy · '+hoyDate.toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'})};
    }
    if(periodo==='semana') {
      const lun=new Date(hoyDate); lun.setDate(hoyDate.getDate()-hoyDate.getDay()+1);
      const sab=new Date(lun); sab.setDate(lun.getDate()+6);
      return {desde:lun.toISOString().slice(0,10), hasta:sab.toISOString().slice(0,10),
        label:'Esta semana · '+lun.toLocaleDateString('es-AR',{day:'numeric',month:'short'})+' al '+sab.toLocaleDateString('es-AR',{day:'numeric',month:'short'})};
    }
    // mes
    const d1=new Date(hoyDate.getFullYear(),hoyDate.getMonth(),1).toISOString().slice(0,10);
    const d2=new Date(hoyDate.getFullYear(),hoyDate.getMonth()+1,0).toISOString().slice(0,10);
    return {desde:d1, hasta:d2, label:hoyDate.toLocaleDateString('es-AR',{month:'long',year:'numeric'})};
  };

  const {desde, hasta, label} = getPeriodo();
  const movsFiltrados = (movs||[]).filter(m=>{
    if(!m.fecha||m.fecha<desde||m.fecha>hasta) return false;
    if(filtro==='ingreso') return m.tipo==='ingreso';
    if(filtro==='egreso')  return m.tipo==='gasto'||m.tipo==='egreso';
    return true;
  });

  const totalIng = movsFiltrados.filter(m=>m.tipo==='ingreso').reduce((a,m)=>a+(Number(m.monto)||0),0);
  const totalEgr = movsFiltrados.filter(m=>m.tipo!=='ingreso').reduce((a,m)=>a+(Number(m.monto)||0),0);
  const balance  = totalIng - totalEgr;
  const fmt = n => '$'+Math.round(Math.abs(Number(n)||0)).toLocaleString('es-AR');

  const enviar = async () => {
    const lic=(()=>{try{return JSON.parse(localStorage.getItem('ec_licencia')||'{}')}catch{return{}}})();
    if(!lic.email){alert('No hay email en tu licencia');return;}
    setEnviando(true);
    const fila=(l,v,c)=>`<tr><td style="padding:6px 0;color:#555;border-bottom:1px solid #eee;font-size:13px">${l}</td><td style="text-align:right;font-weight:600;color:${c||'#222'};border-bottom:1px solid #eee;font-size:13px">${v}</td></tr>`;
    const tipoStr = filtro==='ingreso'?'Solo ingresos':filtro==='egreso'?'Solo egresos':'Todos';
    
    let detHtml = '';
    if(detalles) {
      // Tabla detallada de movimientos
      detHtml = `<br><div style="font-size:11px;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">Detalle de movimientos</div>
      <table style="width:100%;border-collapse:collapse;font-size:12px">
        ${movsFiltrados.sort((a,b)=>a.fecha>b.fecha?-1:1).map(m=>`
          <tr>
            <td style="padding:5px 0;border-bottom:1px solid #f0f0f0;color:#777">${m.fecha}</td>
            <td style="padding:5px 0;border-bottom:1px solid #f0f0f0">${m.desc||''}<br><span style="font-size:10px;color:#999">${m.cat||''}</span></td>
            <td style="padding:5px 0;border-bottom:1px solid #f0f0f0;text-align:right;font-weight:600;color:${m.tipo==='ingreso'?'#16a34a':'#e05c5c'}">${m.tipo==='ingreso'?'+':'-'}${fmt(m.monto)}</td>
          </tr>`).join('')}
      </table>`;
    }

    const htmlContent = `
      <div style="font-family:sans-serif;max-width:520px;margin:0 auto;padding:24px;background:#f9fafb">
        <div style="background:#5b21b6;border-radius:12px 12px 0 0;padding:20px 24px">
          <h2 style="color:#fff;margin:0;font-size:18px">📊 Informe Emma Control</h2>
          <p style="color:rgba(255,255,255,.75);margin:4px 0 0;font-size:13px">${lic.negocio||''} · ${label}</p>
          <p style="color:rgba(255,255,255,.6);margin:2px 0 0;font-size:11px">${tipoStr} · ${movsFiltrados.length} movimientos</p>
        </div>
        <div style="background:#fff;border-radius:0 0 12px 12px;padding:20px 24px;box-shadow:0 2px 8px rgba(0,0,0,.08)">
          <table style="width:100%;border-collapse:collapse;font-size:14px;margin-bottom:16px">
            ${filtro!=='egreso'?fila('💰 Ingresos',fmt(totalIng),'#16a34a'):''}
            ${filtro!=='ingreso'?fila('💸 Egresos',fmt(totalEgr),'#e05c5c'):''}
            ${filtro==='todos'?fila('<b>📊 Balance</b>','<b>'+(balance>=0?'+':'')+fmt(balance)+'</b>',balance>=0?'#16a34a':'#e05c5c'):''}
          </table>
          ${detHtml}
        </div>
        <p style="color:#aaa;font-size:11px;text-align:center;margin-top:16px">Emma Control · Emma Soluciones Digitales</p>
      </div>`;

    try {
      const res = await fetch(MAIL_RELAY_URL,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          app:"emma-control",
          to:lic.email,
          toName:lic.negocio||lic.email,
          subject:`📊 Emma Control · ${label} · Balance ${fmt(balance)}`,
          htmlContent
        })
      });
      alert(res.ok?'✅ Informe enviado a '+lic.email:'❌ No se pudo enviar');
    } catch(e) { alert('❌ Error: '+e.message); }
    setEnviando(false);
  };

  const S = {
    overlay:{position:'fixed',inset:0,background:'rgba(0,0,0,.6)',zIndex:999,display:'flex',alignItems:'center',justifyContent:'center',padding:16},
    modal:{background:'var(--card,#1a2535)',borderRadius:16,padding:24,width:'100%',maxWidth:400,maxHeight:'90vh',overflowY:'auto'},
    h:{fontSize:17,fontWeight:700,color:'var(--text,#e2eaf4)',marginBottom:16},
    label:{fontSize:11,color:'var(--t2,#7a9ab8)',fontWeight:700,textTransform:'uppercase',letterSpacing:'.05em',marginBottom:6,display:'block'},
    pill:(a)=>({padding:'7px 14px',borderRadius:20,border:'none',cursor:'pointer',fontSize:13,fontWeight:600,
      background:a?'#5b21b6':'var(--bg3,#253647)',color:a?'#fff':'var(--t2,#7a9ab8)'}),
    row:{display:'flex',gap:8,marginBottom:16,flexWrap:'wrap'},
    check:{display:'flex',alignItems:'center',gap:8,cursor:'pointer',marginBottom:16},
    preview:{background:'var(--bg2,#1a2535)',borderRadius:10,padding:'12px 16px',marginBottom:16},
    prow:(c)=>({display:'flex',justifyContent:'space-between',fontSize:13,padding:'4px 0',color:c||'var(--text,#e2eaf4)',fontWeight:600}),
    btn:{width:'100%',padding:14,borderRadius:10,border:'none',background:'#5b21b6',color:'#fff',fontSize:15,fontWeight:700,cursor:'pointer',opacity:enviando?0.6:1},
    btnSec:{width:'100%',padding:11,borderRadius:10,border:'0.5px solid var(--border,rgba(255,255,255,.13))',background:'transparent',color:'var(--t2,#7a9ab8)',fontSize:14,cursor:'pointer',marginTop:8},
  };

  return (
    <div style={S.overlay} onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div style={S.modal}>
        <div style={S.h}>📊 Enviar informe por email</div>

        <label style={S.label}>Período</label>
        <div style={S.row}>
          {[['dia','Hoy'],['semana','Semana'],['mes','Mes']].map(([k,l])=>(
            <button key={k} style={S.pill(periodo===k)} onClick={()=>setPeriodo(k)}>{l}</button>
          ))}
        </div>

        <label style={S.label}>Mostrar</label>
        <div style={S.row}>
          {[['todos','Todos'],['ingreso','Solo ingresos'],['egreso','Solo egresos']].map(([k,l])=>(
            <button key={k} style={S.pill(filtro===k)} onClick={()=>setFiltro(k)}>{l}</button>
          ))}
        </div>

        <label style={{...S.check}} onClick={()=>setDetalles(d=>!d)}>
          <div style={{width:20,height:20,borderRadius:6,border:'2px solid #5b21b6',background:detalles?'#5b21b6':'transparent',display:'flex',alignItems:'center',justifyContent:'center'}}>
            {detalles&&<span style={{color:'#fff',fontSize:13}}>✓</span>}
          </div>
          <span style={{fontSize:13,color:'var(--text,#e2eaf4)'}}>Incluir detalle de movimientos</span>
        </label>

        <div style={S.preview}>
          <div style={{fontSize:11,color:'var(--t2,#7a9ab8)',marginBottom:6}}>{label} · {movsFiltrados.length} movimientos</div>
          {(filtro==='todos'||filtro==='ingreso')&&<div style={S.prow('#4dd9a0')}>💰 Ingresos <span>{fmt(totalIng)}</span></div>}
          {(filtro==='todos'||filtro==='egreso')&&<div style={S.prow('#f07070')}>💸 Egresos <span>{fmt(totalEgr)}</span></div>}
          {filtro==='todos'&&<div style={S.prow(balance>=0?'#4dd9a0':'#f07070')}>📊 Balance <span>{balance>=0?'+':''}{fmt(balance)}</span></div>}
        </div>

        <button style={S.btn} onClick={enviar} disabled={enviando}>
          {enviando?'Enviando...':'📧 Enviar informe'}
        </button>
        <button style={S.btnSec} onClick={onClose}>Cancelar</button>
      </div>
    </div>
  );
}
/* ══ FIN MODAL INFORME ════════════════════════════════════════════════ */

function App(){
  const[tema,setTema]=useTema();
  const[esc,setEsc]=useEscala();
  const[pant,setPant]=useState('dashboard');
  const[showInforme,setShowInforme]=useState(false);
  const[mMov,setMMov]=useState(false);const[tipoMov,setTipoMov]=useState(null);
  const[mTarj,setMTarj]=useState(false);const[eTarj,setETarj]=useState(null);
  const[mFijo,setMFijo]=useState(false);const[eFijo,setEFijo]=useState(null);
  const[mEditMov,setMEditMov]=useState(false);const[movEdit,setMovEdit]=useState(null);
  const[deshacer,setDeshacer]=useState(null); // {msg,restaurar} — toast de "deshacer" tras un borrado
  const deshacerTimer=useRef(null);
  const mostrarDeshacer=useCallback((msg,restaurar)=>{
    clearTimeout(deshacerTimer.current);
    setDeshacer({msg,restaurar});
    deshacerTimer.current=setTimeout(()=>setDeshacer(null),6000);
  },[]);
  const aplicarDeshacer=()=>{if(deshacer){deshacer.restaurar();setDeshacer(null);clearTimeout(deshacerTimer.current);}};

  // Login: el ID del usuario autenticado es el dueño de los datos (cada uno ve SOLO lo suyo)
  const[authUid,setAuthUid]=useState(()=>auth.currentUser?auth.currentUser.uid:null);
  useEffect(()=>{const unsub=auth.onAuthStateChanged(u=>{if(u){setAuthUid(u.uid);}else{auth.signInAnonymously().catch(console.error);}});return()=>unsub();},[]);
  const uid=authUid;
  const integracion=useIntegracion(uid);

  // Sincronización con App de Reparto
  const[sincToken,setSincToken]=React.useState(()=>localStorage.getItem('ec_sinc_token')||'');
  const[sincImportando,setSincImportando]=React.useState(false);
  const[sincUltimaSync,setSincUltimaSync]=React.useState(()=>localStorage.getItem('ec_sinc_ultima')||'');
  const generarSincToken=()=>{const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';const t=Array.from({length:8},()=>chars[Math.floor(Math.random()*chars.length)]).join('');setSincToken(t);localStorage.setItem('ec_sinc_token',t);};
  const resetSincToken=()=>{setSincToken('');localStorage.removeItem('ec_sinc_token');localStorage.removeItem('ec_sinc_ultima');};
  const importarDesdeReparto=async()=>{
    if(!sincToken||!window.db)return;setSincImportando(true);
    try{const snap=await window.db.collection('sinc_reparto').doc(sincToken).collection('movimientos').get();if(snap.empty){alert('No hay datos nuevos de la App de Reparto');setSincImportando(false);return;}let nuevos=0;snap.forEach(doc=>{const d=doc.data();if(!movs.find(m=>m.id===d.id)){setMovs(prev=>[...prev,{...d,origen:'reparto'}]);nuevos++;}});const ahora=new Date().toLocaleString('es-AR');setSincUltimaSync(ahora);localStorage.setItem('ec_sinc_ultima',ahora);alert(nuevos>0?'✅ '+nuevos+' movimiento(s) importado(s)':'No hay movimientos nuevos');}
    catch(e){alert('Error al importar: '+e.message);}
    setSincImportando(false);
  };

  const[movs,setMovs,rM]=useFirestoreColl(uid,'movimientos',[]);
  const[tarj,setTarj,rT]=useFirestoreColl(uid,'tarjetas',[]);
  const[fijos,setFijos,rF]=useFirestoreColl(uid,'gastosFijos',FDEF);
  const[pagos,setPagos,rP]=useFirestore(uid,'pagosFijos',[]);
  const[catsCustom,setCatsCustom]=useFirestore(uid,'categoriasCustom',{personal:[],negocio:[],ingreso:[]});
  const agrCatCustom=useCallback((key,nombre)=>{
    setCatsCustom(p=>{
      const arr=p[key]||[];
      if(arr.some(c=>c.toLowerCase()===nombre.toLowerCase()))return p;
      return{...p,[key]:[...arr,nombre]};
    });
  },[setCatsCustom]);

  // Guarda/actualiza el perfil (email + negocio de la licencia) para que el backup diario por mail sepa a quién mandarlo
  useEffect(()=>{
    if(!uid)return;
    const lic=getLicenciaEC();
    if(!lic||!lic.email)return;
    db.collection('users').doc(uid).set({email:lic.email,negocio:lic.negocio||'',actualizado:new Date().toISOString()},{merge:true}).catch(()=>{});
  },[uid]);

  const agrMov=m=>setMovs(p=>[...p,m]);
  const actualizarMov=m2=>setMovs(p=>p.map(m=>m.id===m2.id?m2:m));
  const delMov=id=>{
    if(!window.confirm('¿Eliminar este movimiento?'))return;
    const item=movs.find(m=>m.id===id);
    setMovs(p=>p.filter(m=>m.id!==id));
    if(item)mostrarDeshacer('Movimiento eliminado',()=>setMovs(p=>[...p,item]));
  };
  const saveTarj=t=>setTarj(p=>p.find(x=>x.id===t.id)?p.map(x=>x.id===t.id?t:x):[...p,t]);
  const delTarj=id=>{if(!window.confirm('¿Eliminar tarjeta?'))return;const cq=movs.filter(m=>m.tipo==='cuota'&&m.tarjetaId===id&&!m.saldada&&(m.venc||[]).some(v=>dh(v)>=0));if(cq.length>0&&window.confirm('Esta tarjeta tiene '+cq.length+' compra(s) en cuotas pendientes. ¿Borrar también esas cuotas? (Cancelar = dejarlas en "Cuotas sin tarjeta")')){const ids=new Set(cq.map(c=>c.id));setMovs(p=>p.filter(m=>!ids.has(m.id)));}setTarj(p=>p.filter(t=>t.id!==id));};
  const saveFijo=f=>setFijos(p=>p.find(x=>x.id===f.id)?p.map(x=>x.id===f.id?f:x):[...p,f]);
  const delFijo=id=>{if(window.confirm('¿Eliminar gasto fijo?'))setFijos(p=>p.filter(f=>f.id!==id));};
  const cerrarSesion=()=>{if(window.confirm('¿Cerrar sesión?')){localStorage.removeItem('ec_licencia');window.location.reload();}};
  const exportarDatos=()=>{const data={movs,tarj,fijos,pagos,exportado:new Date().toISOString()};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download=`emma-control-${hoy()}.json`;a.click();};
  
  const importarDatos=()=>{const inp=document.createElement('input');inp.type='file';inp.accept='.json';inp.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{const d=JSON.parse(ev.target.result);if(!uid){alert('Tenés que estar logueado');return;}setMovs(d.movs||[]);setTarj(d.tarj||[]);setFijos(d.fijos||[]);setPagos(d.pagos||[]);alert('✅ Importados: '+((d.movs||[]).length)+' movimientos');}catch(err){alert('❌ Error: '+err.message);}};r.readAsText(f);};inp.click();};
  const limpiarDatos=()=>{if(!window.confirm('¿Borrar TODOS los datos?'))return;if(!window.confirm('¿Estás seguro? No se puede deshacer.'))return;setMovs([]);setTarj([]);setFijos(FDEF);setPagos([]);alert('✅ Datos borrados');};
  const abrirMov=(tipo)=>{setTipoMov(tipo||null);setMMov(true);};

  // ── Atrás del teléfono (gesto lateral / botón): volver a Inicio o cerrar el modal abierto, en vez de salir de la app ──
  const navRef=useRef({});
  useEffect(()=>{navRef.current={pant,modal:mMov||mTarj||mFijo||mEditMov||showInforme};});
  useEffect(()=>{
    window.history.pushState(null,'');
    const onPop=()=>{
      const st=navRef.current;
      if(st.modal){setMMov(false);setMTarj(false);setMFijo(false);setMEditMov(false);setShowInforme(false);window.history.pushState(null,'');return;}
      if(st.pant!=='dashboard'){setPant('dashboard');window.history.pushState(null,'');}
    };
    window.addEventListener('popstate',onPop);
    return()=>window.removeEventListener('popstate',onPop);
  },[]);

  // ── Deslizar entre pestañas (swipe) ──
  const swipeLeft=useCallback(()=>{if(mMov||mTarj||mFijo||mEditMov||showInforme)return;const nav=['dashboard','tarjetas','fijos','config'];if(nav.includes(pant)){const i=nav.indexOf(pant);if(i<nav.length-1)setPant(nav[i+1]);}},[pant,mMov,mTarj,mFijo,mEditMov,showInforme]);
  const swipeRight=useCallback(()=>{if(mMov||mTarj||mFijo||mEditMov||showInforme)return;const nav=['dashboard','tarjetas','fijos','config'];const det=['ingresos','egresos','arqueo'];if(nav.includes(pant)){const i=nav.indexOf(pant);if(i>0)setPant(nav[i-1]);}else if(det.includes(pant)){setPant('dashboard');}},[pant,mMov,mTarj,mFijo,mEditMov,showInforme]);
  const{onTouchStart,onTouchEnd}=useSwipe(swipeLeft,swipeRight);

  // Aviso local (una vez por día) de gastos fijos vencidos o por vencer en los próximos 2 días.
  useEffect(()=>{
    if(!uid||!rF||!rM)return;
    if(typeof Notification==='undefined')return;
    const hoyStr=hoy();
    if(localStorage.getItem('ec_notif_fecha')===hoyStr)return;
    const mesK=mk(hoyStr);
    const[y,mo]=hoyStr.split('-');
    const pend=(fijos||[]).filter(f=>f.activo&&!fijoPagado(f,movs,mesK)).map(f=>({f,d:dh(`${y}-${mo}-${pad(f.diaVenc)}`)})).filter(x=>x.d<=2);
    if(pend.length===0)return;
    localStorage.setItem('ec_notif_fecha',hoyStr);
    const avisar=()=>{
      const venc=pend.filter(x=>x.d<0).length;
      const titulo=venc>0?`⚠️ Tenés ${venc} gasto${venc>1?'s':''} fijo${venc>1?'s':''} vencido${venc>1?'s':''}`:'📌 Gastos fijos por vencer';
      const cuerpo=pend.map(x=>`${x.f.nombre} (${x.d<0?'venció hace '+(-x.d)+'d':x.d===0?'hoy':'en '+x.d+'d'})`).join(', ');
      try{
        if(navigator.serviceWorker&&navigator.serviceWorker.ready){
          navigator.serviceWorker.ready.then(reg=>reg.showNotification(titulo,{body:cuerpo,tag:'ec-fijos'})).catch(()=>{try{new Notification(titulo,{body:cuerpo});}catch(e){}});
        }else{
          new Notification(titulo,{body:cuerpo});
        }
      }catch(e){}
    };
    if(Notification.permission==='granted')avisar();
    else if(Notification.permission!=='denied')Notification.requestPermission().then(p=>{if(p==='granted')avisar();}).catch(()=>{});
  },[uid,rF,rM,fijos,movs]);

  // ── PANTALLAS DE ESTADO ──
  if(!(rM&&rT&&rF&&rP))return<div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:16,background:'var(--bg)'}}>
    <div className="spin" style={{width:44,height:44,borderRadius:12,background:'var(--primary)',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'var(--fh)',fontWeight:800,fontSize:'0.95rem',color:'#fff'}}>EC</div>
    <div style={{fontFamily:'var(--fh)',fontSize:16,color:'var(--t2)'}}>Sincronizando datos...</div>
  </div>;

  const render=()=>{switch(pant){
    case'dashboard':return<Dashboard movs={movs} fijos={fijos} pagos={pagos} tarjetas={tarj} onNuevo={()=>abrirMov()} onVerIngresos={()=>setPant('ingresos')} onVerEgresos={()=>setPant('egresos')} onVerArqueo={()=>setPant('arqueo')} onVerFijos={()=>setPant('fijos')}/>;
    case'ingresos':return<DetalleIngresos movs={movs} onNuevo={t=>{setTipoMov(t);setMMov(true);}} onVolver={()=>setPant('dashboard')} onEditar={m=>{setMovEdit(m);setMEditMov(true);}} onEliminar={delMov}/>;
    case'egresos':return<DetalleEgresos movs={movs} tarjetas={tarj} onNuevo={t=>{setTipoMov(t);setMMov(true);}} onVolver={()=>setPant('dashboard')} onEditar={m=>{setMovEdit(m);setMEditMov(true);}} onEliminar={delMov}/>;
    case'tarjetas':return<Tarjetas tarjetas={tarj} movs={movs} onAgregar={()=>{setETarj(null);setMTarj(true);}} onEditar={t=>{setETarj(t);setMTarj(true);}} onEliminar={delTarj} onSaldarCuota={id=>{if(window.confirm('¿Marcar esta cuota como saldada? Va a desaparecer de la deuda.'))setMovs(p=>p.map(m=>m.id===id?{...m,saldada:true}:m));}} onPagarCuota={c=>{if(!window.confirm('¿Confirmás el pago de una cuota de "'+(c.desc||'Cuota')+'" ('+fmt(c.montoCuota)+')? Se registra como gasto.'))return;setMovs(p=>[...p,{id:uid2(),tipo:'gasto',desc:(c.desc||'Cuota')+' (cuota)',monto:c.montoCuota,fecha:hoy(),cat:'Tarjeta',ent:c.ent||'personal',cuotaId:c.id}]);}} onEliminarCuota={delMov}/>;
    case'fijos':return<GastosFijos fijos={fijos} movs={movs} setMovs={setMovs} onAgregar={()=>{setEFijo(null);setMFijo(true);}} onEditar={f=>{setEFijo(f);setMFijo(true);}} onEliminar={delFijo} mostrarDeshacer={mostrarDeshacer}/>;
    case'arqueo':return<Arqueo movs={movs} onVolver={()=>setPant('dashboard')}/>;
    case'config':return<Config user={getLicenciaEC()} onCerrarSesion={cerrarSesion} tema={tema} setTema={setTema} esc={esc} setEsc={setEsc} integracion={integracion} onExportar={exportarDatos} onImportar={importarDatos} onLimpiar={limpiarDatos} onInforme={()=>setShowInforme(true)} sincToken={sincToken} sincImportando={sincImportando} sincUltimaSync={sincUltimaSync} generarSincToken={generarSincToken} resetSincToken={resetSincToken} importarDesdeReparto={importarDesdeReparto}/>;
  }};

  const navPant=['dashboard','tarjetas','fijos','config'];
  const fabAccion=pant==='tarjetas'?(()=>{setETarj(null);setMTarj(true);}):pant==='fijos'?(()=>{setEFijo(null);setMFijo(true);}):(()=>abrirMov());
  return<>
    <HeaderApp onInicio={()=>setPant('dashboard')}/>
    <div onTouchStart={onTouchStart} onTouchEnd={onTouchEnd} style={{flex:1,display:'flex',flexDirection:'column',minHeight:0,position:'relative'}}>
      {render()}
      {navPant.includes(pant)&&<Nav act={pant} go={setPant} onFab={fabAccion}/>}
      {deshacer&&<div style={{position:'absolute',left:14,right:14,bottom:navPant.includes(pant)?78:14,zIndex:300,background:'var(--card)',border:'1px solid var(--border)',borderRadius:14,padding:'10px 10px 10px 14px',display:'flex',alignItems:'center',gap:10,boxShadow:'0 8px 24px rgba(0,0,0,0.25)'}}>
        <span style={{flex:1,fontSize:13,color:'var(--text)',fontWeight:500}}>{deshacer.msg}</span>
        <button onClick={aplicarDeshacer} style={{padding:'7px 14px',borderRadius:10,border:'none',background:'var(--primary)',color:'#fff',fontSize:12,fontWeight:700,cursor:'pointer',flexShrink:0}}>Deshacer</button>
      </div>}
    </div>
    {mMov&&<ModalMov tarjetas={tarj} fijos={fijos} movs={movs} onGuardar={agrMov} tipoInicial={tipoMov} catsCustom={catsCustom} onAddCat={agrCatCustom} onClose={()=>{setMMov(false);setTipoMov(null);}}/>}
    {showInforme&&<ModalInforme movs={movs} onClose={()=>setShowInforme(false)}/>}
    {mEditMov&&movEdit&&<ModalEditMov mov={movEdit} tarjetas={tarj} fijos={fijos} movs={movs} onGuardar={actualizarMov} catsCustom={catsCustom} onAddCat={agrCatCustom} onClose={()=>{setMEditMov(false);setMovEdit(null);}}/>}
    {mTarj&&<ModalTarj tarjeta={eTarj} onGuardar={saveTarj} onClose={()=>{setMTarj(false);setETarj(null);}}/>}
    {mFijo&&<ModalFijo fijo={eFijo} onGuardar={saveFijo} onClose={()=>{setMFijo(false);setEFijo(null);}}/>}
  </>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<AppWrapper/>);
</script>
  <script>
  // Service worker con estrategia "red primero, caché como respaldo": mientras hay conexión
  // siempre se usa la versión más nueva (igual que antes); sin conexión, se sirve la última
  // copia guardada — así la app queda disponible offline sin perder el auto-actualizado.
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
  </script>
</body></html>
