<script type="text/babel">
const {useState,useEffect,useMemo,useCallback,useRef}=React;
const fmt=n=>'$'+(Number(n)||0).toLocaleString('es-AR');
const hoy=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const mk=f=>f?f.slice(0,7):'';
const MESES_L=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const DIAS_L=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const mlabel=m=>{if(!m)return'';const[y,mo]=m.split('-');return MESES_L[+mo-1]+' '+y;};
const fechaLarga=f=>{if(!f)return'';const d=new Date(f+'T12:00:00');return`${DIAS_L[d.getDay()]} ${d.getDate()} de ${MESES_L[d.getMonth()]}`;};
const uid2=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const dh=f=>{const h=new Date();h.setHours(0,0,0,0);return Math.round((new Date(f+'T12:00:00')-h)/86400000);};
const addM=(f,n)=>{const d=new Date(f+'T12:00:00');d.setMonth(d.getMonth()+n);return d.toISOString().slice(0,10);};
const pad=n=>String(n).padStart(2,'0');
const esRedondeo=desc=>/redondeo/i.test(desc||'');
// Devuelve el mes calendario siguiente a "mesStr" (formato "YYYY-MM").
const nextMesKey=mesStr=>{const[y,m]=mesStr.split('-').map(Number);const d=new Date(y,m,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');};
// ¿Un gasto fijo ya está pagado en el mes "mes"? Se guarda buscando en "movs" un gasto vinculado
// (fijoId+fijoMes) — no depende de ninguna colección aparte, así que siempre refleja lo real.
const fijoPagado=(f,movs,mes)=>(movs||[]).some(m=>m.fijoId===f.id&&m.fijoMes===mes);
// Encuentra el primer mes (desde fechaRef en adelante) que todavía no esté marcado como pagado
// para ese fijo — así un pago adelantado (cargado antes del vencimiento) queda en el mes que
// corresponde y no se "pierde" en el mes de la fecha en la que se cargó.
const primerMesNoPagado=(f,movs,fechaRef)=>{
  let mes=mk(fechaRef);
  for(let i=0;i<12;i++){if(!fijoPagado(f,movs,mes))return mes;mes=nextMesKey(mes);}
  return mes;
};
// Compara el texto de una descripción contra el nombre de un gasto fijo (para detectar que un
// gasto cargado "suelto" en realidad corresponde a un fijo).
const coincideFijo=(desc,nombreFijo)=>{
  const a=(desc||'').toLowerCase().trim(),b=(nombreFijo||'').toLowerCase().trim();
  return!!a&&!!b&&(a.includes(b)||b.includes(a));
};

/* ══ FIREBASE HOOK ══ */
function useFirestore(uid,col,init){
  const[v,sv]=useState(init);const[ready,setReady]=useState(false);const tmr=useRef(null);
  useEffect(()=>{if(!uid)return;const ref=db.collection('users').doc(uid).collection('datos').doc(col);
    const unsub=ref.onSnapshot(snap=>{if(snap.exists){const d=snap.data();sv(d.items||init);}else{sv(init);}setReady(true);},()=>setReady(true));
    return()=>unsub();},[uid,col]);
  const set=useCallback(x=>{const next=typeof x==='function'?x(v):x;sv(next);if(!uid)return;clearTimeout(tmr.current);tmr.current=setTimeout(()=>{db.collection('users').doc(uid).collection('datos').doc(col).set({items:next}).catch(console.error);},600);},[uid,col,v]);
  return[v,set,ready];
}

/* ══ FIREBASE HOOK — POR REGISTRO (evita que 2 dispositivos offline se pisen los datos) ══ */
// En vez de un solo documento con un array gigante (donde el último dispositivo en sincronizar
// pisa todo lo que escribió el otro), cada registro vive en su propio documento dentro de
// users/{uid}/datos/{col}/items/{id}. Así, si el celular y la compu editan cosas distintas estando
// los dos sin conexión, al reconectarse cada uno escribe solo SUS documentos — nunca se pisan entre sí.
// Además mantiene, en segundo plano, una copia espejo (debounced) en el documento viejo
// users/{uid}/datos/{col} — el worker de backup diario por mail todavía lee de ahí vía REST API,
// así sigue funcionando sin tocarlo.
function useFirestoreColl(uid,col,init){
  const[v,sv]=useState(init);
  const[ready,setReady]=useState(false);
  const prevRef=useRef(init); // último estado ya reflejado en Firestore (para calcular qué cambió)
  const mirrorTmr=useRef(null);
  useEffect(()=>{
    if(!uid)return;
    let activo=true,unsub=()=>{};
    const docRef=db.collection('users').doc(uid).collection('datos').doc(col);
    const collRef=docRef.collection('items');
    (async()=>{
      try{
        const metaRef=db.collection('users').doc(uid).collection('_meta').doc('migr_'+col);
        const metaSnap=await metaRef.get();
        if(!metaSnap.exists){
          const oldSnap=await docRef.get();
          const oldItems=(oldSnap.exists&&Array.isArray(oldSnap.data().items))?oldSnap.data().items:null;
          const semilla=(oldItems&&oldItems.length)?oldItems:(col==='gastosFijos'?init:null);
          if(semilla&&semilla.length){
            for(let i=0;i<semilla.length;i+=450){
              const b=db.batch();
              semilla.slice(i,i+450).forEach(item=>{if(!item.id)item.id=uid2();b.set(collRef.doc(String(item.id)),item);});
              await b.commit();
            }
          }
          await metaRef.set({hecho:true,fecha:new Date().toISOString()});
        }
      }catch(e){console.error('migración '+col,e);}
      if(!activo)return;
      unsub=collRef.onSnapshot(snap=>{
        const next=snap.docs.map(d=>d.data());
        prevRef.current=next;
        sv(next);
        setReady(true);
      },()=>setReady(true));
    })();
    return()=>{activo=false;unsub();};
  },[uid,col]);
  useEffect(()=>{
    if(!uid||!ready)return;
    clearTimeout(mirrorTmr.current);
    mirrorTmr.current=setTimeout(()=>{db.collection('users').doc(uid).collection('datos').doc(col).set({items:v}).catch(()=>{});},1500);
    return()=>clearTimeout(mirrorTmr.current);
  },[uid,col,v,ready]);
  const set=useCallback(x=>{
    const next=typeof x==='function'?x(v):x;
    sv(next);
    if(!uid)return;
    const prev=prevRef.current||[];
    const prevMap={};prev.forEach(it=>{if(it&&it.id)prevMap[it.id]=it;});
    const nextMap={};next.forEach(it=>{if(it&&it.id)nextMap[it.id]=it;});
    const collRef=db.collection('users').doc(uid).collection('datos').doc(col).collection('items');
    const ops=[];
    next.forEach(it=>{if(!it||!it.id)return;const antes=prevMap[it.id];if(!antes||JSON.stringify(antes)!==JSON.stringify(it))ops.push(['set',it.id,it]);});
    prev.forEach(it=>{if(it&&it.id&&!nextMap[it.id])ops.push(['del',it.id,null]);});
    prevRef.current=next;
    for(let i=0;i<ops.length;i+=450){
      const b=db.batch();
      ops.slice(i,i+450).forEach(([tipo,id,data])=>{const ref=collRef.doc(String(id));tipo==='set'?b.set(ref,data):b.delete(ref);});
      b.commit().catch(console.error);
    }
  },[uid,col,v]);
  return[v,set,ready];
}

    </>}
  </div>;
}

function PantallaPinEC({pin,onOk}){
  const[intento,setIntento]=useState('');
  const[err,setErr]=useState('');
  const[intentos,setIntentos]=useState(0);
  const[bloq,setBloq]=useState(false);
  const lic=getLicenciaEC();
  const bioOn=localStorage.getItem('ec_bio_on')==='1';const bioCred=localStorage.getItem('ec_bio_cred');
  useEffect(()=>{if(bioOn&&bioCred){bioVerificar(bioCred).then(onOk).catch(()=>{});}},[]);
  const tryBio=async()=>{setErr('');try{await bioVerificar(bioCred);onOk();}catch(e){setErr('No se reconoció la huella. Usá el PIN.');}};
  const teclas=[1,2,3,4,5,6,7,8,9,'','0','⌫'];
  return<div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:20,background:'var(--bg)'}}>

    <div style={{fontFamily:'var(--fh)',fontSize:20,fontWeight:700,color:'var(--text)'}}>{lic?.negocio||'Emma Control'}</div>
    <div style={{fontSize:14,color:'var(--t2)'}}>Ingresá tu PIN de acceso</div>
    <div style={{display:'flex',gap:14}}>{[0,1,2,3].map(i=><div key={i} style={{width:16,height:16,borderRadius:'50%',background:intento.length>i?'var(--primary)':'transparent',border:'2px solid var(--primary)'}}/>)}</div>
    {err&&<div style={{color:'#dc2626',fontSize:13}}>{err}</div>}
    {!bloq&&<div style={{display:'grid',gridTemplateColumns:'repeat(3,72px)',gap:10}}>
      {teclas.map((t,i)=><button key={i} style={{height:60,fontSize:t==='⌫'?18:20,fontWeight:500,borderRadius:12,background:t===''?'transparent':'var(--card)',border:t===''?'none':'0.5px solid var(--border)',color:'var(--text)',cursor:t===''?'default':'pointer',opacity:t===''?0:1}} onClick={()=>{
        if(t==='')return;
        if(t==='⌫'){setIntento(v=>v.slice(0,-1));return;}
        if(intento.length>=4)return;
        const nv=intento+t;setIntento(nv);
        if(nv.length===4)setTimeout(()=>{
          if(nv===String(pin)){setErr('');onOk();}
          else{setIntento('');setIntentos(prev=>{const n2=prev+1;if(n2>=5){setBloq(true);setErr('Demasiados intentos.');}else setErr('PIN incorrecto ('+String(5-n2)+' restante'+String(5-n2!==1?'s':'')+')');return n2;});}
        },200);
      }}>{t}</button>)}
    </div>}
    {bioOn&&bioCred&&!bloq&&<button onClick={tryBio} style={{marginTop:6,padding:'10px 18px',borderRadius:12,fontSize:14,fontWeight:600,border:'1px solid var(--primary)',background:'var(--pdim)',color:'var(--primary)',cursor:'pointer'}}>👆 Desbloquear con huella</button>}
  </div>;
}

/* ══ CALENDARIO ══ */
function Calendario({movimientos}){
  const hoyStr=hoy();
  const[mes,setMes]=useState({y:new Date().getFullYear(),m:new Date().getMonth()});
  const[diaSelec,setDiaSelec]=useState(null);
  const{y,m}=mes;
  const movPorDia=useMemo(()=>{const r={};movimientos.forEach(mv=>{if(!mv.fecha)return;if(!r[mv.fecha])r[mv.fecha]=[];r[mv.fecha].push(mv);});return r;},[movimientos]);
  const primer=new Date(y,m,1).getDay();const offset=primer===0?6:primer-1;const dias=new Date(y,m+1,0).getDate();
  const celdas=[];for(let i=0;i<offset;i++)celdas.push(null);for(let d=1;d<=dias;d++)celdas.push(d);
  const cambiar=dir=>{let nm=m+dir,ny=y;if(nm>11){nm=0;ny++;}if(nm<0){nm=11;ny--;}setMes({y:ny,m:nm});setDiaSelec(null);};
  const selDia=d=>{const k=`${y}-${pad(m+1)}-${pad(d)}`;setDiaSelec(diaSelec===k?null:k);};
  const isHoy=d=>hoyStr===`${y}-${pad(m+1)}-${pad(d)}`;
  const movDia=diaSelec?movPorDia[diaSelec]||[]:[];
  const ingDia=movDia.filter(m=>m.tipo==='ingreso').reduce((a,m)=>a+m.monto,0);
  const gastDia=movDia.filter(m=>m.tipo==='gasto').reduce((a,m)=>a+m.monto,0);
  return<div>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
      <button onClick={()=>cambiar(-1)} style={{background:'none',border:'none',color:'var(--primary)',fontSize:20,cursor:'pointer',padding:'0 4px'}}>‹</button>
      <span style={{fontFamily:'var(--fh)',fontSize:13,fontWeight:700,color:'var(--text)'}}>{MESES_L[m]} {y}</span>
      <button onClick={()=>cambiar(1)} style={{background:'none',border:'none',color:'var(--primary)',fontSize:20,cursor:'pointer',padding:'0 4px'}}>›</button>
    </div>
    <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',marginBottom:4}}>
      {['Lu','Ma','Mi','Ju','Vi','Sa','Do'].map((d,i)=><div key={d} style={{textAlign:'center',fontSize:10,fontWeight:700,color:i>=5?'#dc2626':'var(--t3)',padding:'2px 0'}}>{d}</div>)}
    </div>
    <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:2}}>
      {celdas.map((d,i)=>{
        if(!d)return<div key={i}/>;
        const k=`${y}-${pad(m+1)}-${pad(d)}`;
        const tieneMovs=!!movPorDia[k];const selec=diaSelec===k;const esHoyD=isHoy(d);
        return<div key={i} onClick={()=>selDia(d)} style={{display:'flex',flexDirection:'column',alignItems:'center',cursor:'pointer',padding:'2px 0'}}>
          <div style={{width:30,height:30,borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,fontWeight:esHoyD||selec?700:400,background:esHoyD?'var(--primary)':selec?'var(--pdim)':'transparent',color:esHoyD?'#fff':selec?'var(--primary)':'var(--text)',border:selec&&!esHoyD?'1.5px solid var(--primary)':'none'}}>{d}</div>
          {tieneMovs&&<div style={{width:4,height:4,borderRadius:'50%',background:esHoyD?'#fff':'var(--primary)',marginTop:1,opacity:0.7}}/>}
        </div>;
      })}
    </div>
    {diaSelec&&<div style={{marginTop:10,padding:'10px 12px',background:'var(--card2)',borderRadius:10,border:'0.5px solid var(--border)'}}>
      <div style={{fontSize:11,fontWeight:700,color:'var(--primary)',marginBottom:6}}>{fechaLarga(diaSelec)}</div>
      {movDia.length===0?<div style={{fontSize:12,color:'var(--t3)'}}>Sin movimientos registrados</div>:<>
        <div style={{display:'flex',gap:10,marginBottom:6}}>
          {ingDia>0&&<span style={{fontSize:11,color:'#16a34a',fontWeight:600}}>↑ {fmt(ingDia)}</span>}
          {gastDia>0&&<span style={{fontSize:11,color:'#dc2626',fontWeight:600}}>↓ {fmt(gastDia)}</span>}
        </div>
        {movDia.map(mv=><div key={mv.id} style={{display:'flex',justifyContent:'space-between',fontSize:12,padding:'3px 6px',borderBottom:'0.5px solid var(--border)',...(esRedondeo(mv.desc)?{background:'rgba(245,158,11,0.15)',borderRadius:6,border:'1px solid #f59e0b',borderBottom:'1px solid #f59e0b'}:{})}}>
          <span style={{color:'var(--text)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',maxWidth:'65%'}}>{esRedondeo(mv.desc)&&'🔄 '}{mv.desc}</span>
          <span style={{fontWeight:600,color:mv.tipo==='ingreso'?'#16a34a':'#dc2626',flexShrink:0}}>{mv.tipo==='ingreso'?'+':'-'}{fmt(mv.monto)}</span>
        </div>)}
      </>}
    </div>}
  </div>;
}

/* ══ MODALES ══ */
function ModalMov({tarjetas,fijos=[],movs=[],onGuardar,onClose,tipoInicial,catsCustom={},onAddCat}){
  const[tipo,setTipo]=useState(tipoInicial||'gasto');const[ent,setEnt]=useState('negocio');
  const[desc,setDesc]=useState('');const[monto,setMonto]=useState('');const[fecha,setFecha]=useState(hoy());
  const[metodo,setMetodo]=useState('efectivo');const[tid,setTid]=useState(tarjetas[0]?.id||'');
  const[cuotas,setCuotas]=useState(1);const[cat,setCat]=useState('');
  const[catOtros,setCatOtros]=useState('');
  const[vinculoFijo,setVinculoFijo]=useState('');
  const catsKey=tipo==='ingreso'?'ingreso':ent;
  const catsBase=tipo==='ingreso'?CATS.ingreso:(CATS[ent]||[]);
  const cats=[...catsBase.filter(c=>c!=='Otros'),...(catsCustom[catsKey]||[]),'Otros'];
  useEffect(()=>{setCat(cats[0]||'');setCatOtros('');},[tipo,ent]);

  const esCompraEnCuotas=metodo==='tarjeta'&&cuotas>1;
  // Gastos fijos que se pueden vincular a este movimiento: de la misma entidad, y que todavía no
  // estén pagados en el mes de la fecha elegida (o el siguiente, para poder cargar un pago
  // adelantado sin que desaparezca de la lista).
  const fijosDisponibles=tipo==='gasto'&&!esCompraEnCuotas?fijos.filter(f=>f.activo&&f.entidad===ent&&(!fijoPagado(f,movs,mk(fecha))||!fijoPagado(f,movs,nextMesKey(mk(fecha))))):[];
  // Gastos cotidianos que se repiten seguido (comida, combustible, etc.) aunque no sean un gasto
  // fijo: se juntan por descripción y a partir de 2 veces se ofrecen como sugerencia.
  const descripcionesFrecuentes=(()=>{
    if(tipo!=='gasto'||esCompraEnCuotas)return[];
    const porDesc={};
    (movs||[]).forEach(m=>{
      if(m.tipo!=='gasto'||(m.ent||'personal')!==ent)return;
      const txt=(m.desc||'').trim();if(!txt)return;
      const k=txt.toLowerCase();
      if(!porDesc[k])porDesc[k]={desc:txt,veces:0,cat:m.cat,monto:m.monto,fecha:m.fecha||''};
      porDesc[k].veces++;
      if((m.fecha||'')>=porDesc[k].fecha){porDesc[k].cat=m.cat;porDesc[k].monto=m.monto;porDesc[k].fecha=m.fecha;}
    });
    return Object.values(porDesc)
      .filter(x=>x.veces>=2&&!fijosDisponibles.some(f=>coincideFijo(x.desc,f.nombre)))
      .sort((a,b)=>b.veces-a.veces).slice(0,8);
  })();
  // La Descripción hace también de selector "¿es el pago de un gasto fijo?" y de autocompletar de
  // gastos frecuentes.
  const cambiarDesc=v=>{
    setDesc(v);
    if(tipo!=='gasto'||esCompraEnCuotas)return;
    const vTrim=v.trim();
    const matchFijo=vTrim.length>=3?fijosDisponibles.find(f=>coincideFijo(vTrim,f.nombre)):null;
    if(matchFijo){
      setVinculoFijo(matchFijo.id);
      if(!monto)setMonto(String(matchFijo.monto));
      if(cats.includes(matchFijo.cat)&&matchFijo.cat!=='Otros')setCat(matchFijo.cat);
      return;
    }
    if(vinculoFijo)setVinculoFijo('');
    const vNorm=vTrim.toLowerCase();
    const matchFrec=vTrim.length>=3?descripcionesFrecuentes.find(x=>x.desc.toLowerCase()===vNorm):null;
    if(matchFrec){
      if(!monto)setMonto(String(matchFrec.monto));
      if(cats.includes(matchFrec.cat)&&matchFrec.cat!=='Otros')setCat(matchFrec.cat);
    }
  };

  const guardar=()=>{
    if(!desc.trim())return alert('Escribí una descripción');
    if(!monto||Number(monto)<=0)return alert('Ingresá un monto válido');
    if(cat==='Otros'&&!catOtros.trim())return alert('Escribí el nombre de la nueva categoría');
    const m=Number(monto);
    const esNuevaCat=cat==='Otros'&&catOtros.trim();
    const cat_final=esNuevaCat?catOtros.trim():cat;
    if(esNuevaCat)onAddCat&&onAddCat(catsKey,cat_final);
    // Si la Descripción coincidió con un gasto fijo pendiente, "cambiarDesc" ya dejó vinculoFijo
    // cargado. El mes usa primerMesNoPagado para que un pago adelantado quede en el mes correcto.
    const fijoVinculado=vinculoFijo&&fijosDisponibles.find(f=>f.id===vinculoFijo);
    const camposFijo=tipo==='gasto'&&!esCompraEnCuotas?(fijoVinculado?{fijoId:fijoVinculado.id,fijoMes:primerMesNoPagado(fijoVinculado,movs,fecha)}:{}):{};
    if(tipo==='gasto'&&metodo==='tarjeta'&&tid&&cuotas>1){
      const tarj=tarjetas.find(t=>t.id===tid);const mc=Math.round(m/cuotas);
      const venc=Array.from({length:cuotas},(_,i)=>{if(tarj?.diaVenc){const d=new Date(fecha+'T12:00:00');d.setMonth(d.getMonth()+i+1);d.setDate(tarj.diaVenc);return d.toISOString().slice(0,10);}return addM(fecha,i+1);});
      onGuardar({id:uid2(),tipo:'cuota',ent,desc,montoTotal:m,cuotas,montoCuota:mc,tarjetaId:tid,fecha,cat:cat_final,venc});
    }else{onGuardar({id:uid2(),tipo,ent,desc,monto:m,fecha,metodo:tipo==='gasto'?metodo:'',tarjetaId:metodo==='tarjeta'&&tipo==='gasto'?tid:'',cat:cat_final,...camposFijo});}
    onClose();
  };
  const mn=Number(monto)||0;
  return<Modal onClose={onClose} title="Nueva transacción">
    <div style={{marginBottom:12}}><Toggle opts={[['gasto','💸 Gasto'],['ingreso','💰 Ingreso']]} val={tipo} onChange={setTipo} cm={{gasto:'var(--danger)',ingreso:'var(--success)'}}/></div>
    <div style={{marginBottom:12}}><Toggle opts={[['personal','👤 Personal'],['negocio','💼 Trabajo']]} val={ent} onChange={setEnt} cm={{personal:'var(--pers)',negocio:'var(--neg)'}}/></div>
    <label style={S.lbl}>Descripción</label>
    <input style={{...S.inp,marginBottom:8}} value={desc} onChange={e=>cambiarDesc(e.target.value)} placeholder="Ej: Comida, Combustible, Compras..." list={(fijosDisponibles.length>0||descripcionesFrecuentes.length>0)?'desc-dl':undefined}/>
    {(fijosDisponibles.length>0||descripcionesFrecuentes.length>0)&&<datalist id="desc-dl">
      {fijosDisponibles.map(f=><option key={'f-'+f.id} value={f.nombre}>{fmt(f.monto)} · gasto fijo pendiente</option>)}
      {descripcionesFrecuentes.map(x=><option key={'d-'+x.desc} value={x.desc}>{fmt(x.monto)} · usado {x.veces} veces</option>)}
    </datalist>}
    {vinculoFijo?<div style={{background:'#f0fdf4',border:'0.5px solid #bbf7d0',borderRadius:10,padding:'9px 14px',marginBottom:12,fontSize:12,color:'#15803d'}}>
      ✓ Coincide con un gasto fijo — al guardar queda marcado como pagado en Gastos Fijos (categoría y monto completados).
    </div>:<div style={{marginBottom:12}}/>}
    <label style={S.lbl}>Monto $</label>
    <input style={{...S.inpR,marginBottom:12}} type="number" inputMode="numeric" value={monto} onChange={e=>setMonto(e.target.value)} placeholder="0"/>
    <label style={S.lbl}>Fecha</label>
    <input style={{...S.inp,marginBottom:12}} type="date" value={fecha} onChange={e=>setFecha(e.target.value)}/>
    <label style={S.lbl}>Categoría</label>
    <select style={{...S.inp,marginBottom:cat==='Otros'?8:12}} value={cat} onChange={e=>{setCat(e.target.value);if(e.target.value!=='Otros')setCatOtros('');}}>{cats.map(c=><option key={c} value={c}>{c}</option>)}</select>
    {cat==='Otros'&&<input style={{...S.inp,marginBottom:12}} value={catOtros} onChange={e=>setCatOtros(e.target.value)} placeholder="Escribí la nueva categoría" autoFocus/>}
    {tipo==='gasto'&&<>
      <label style={S.lbl}>Método de pago</label>
      <div style={{display:'flex',gap:6,marginBottom:12,flexWrap:'wrap'}}>
        {['efectivo','débito','tarjeta','transferencia'].map(mt=><button key={mt} onClick={()=>setMetodo(mt)} style={{padding:'7px 13px',borderRadius:20,border:`1px solid ${metodo===mt?'var(--primary)':'var(--border)'}`,background:metodo===mt?'var(--pdim)':'transparent',color:metodo===mt?'var(--primary)':'var(--t2)',fontSize:12,fontWeight:600,cursor:'pointer'}}>{mt}</button>)}
      </div>
      {metodo==='tarjeta'&&<>
        <label style={S.lbl}>Tarjeta</label>
        {tarjetas.length===0?<div style={{background:'#fffbeb',border:'0.5px solid #fde68a',borderRadius:10,padding:'10px 14px',fontSize:13,color:'#92400e',marginBottom:12}}>⚠️ Primero agregá una tarjeta</div>
          :<select style={{...S.inp,marginBottom:12}} value={tid} onChange={e=>setTid(e.target.value)}>{tarjetas.map(t=><option key={t.id} value={t.id}>{t.nombre}</option>)}</select>}
        {tid&&<>
          <label style={S.lbl}>Cuotas</label>
          <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:12}}>
            {[1,2,3,6,9,12,18,24].map(n=><button key={n} onClick={()=>setCuotas(n)} style={{padding:'7px 12px',borderRadius:20,border:`1px solid ${cuotas===n?'var(--primary)':'var(--border)'}`,background:cuotas===n?'var(--pdim)':'transparent',color:cuotas===n?'var(--primary)':'var(--t2)',fontSize:12,fontWeight:600,cursor:'pointer'}}>{n===1?'1 pago':`${n}x`}</button>)}
          </div>
          {cuotas>1&&mn>0&&<div style={{background:'#f0fdf4',border:'0.5px solid #bbf7d0',borderRadius:10,padding:'10px 14px',marginBottom:12}}>
            <span style={{fontSize:14,color:'#15803d',fontWeight:700}}>{cuotas} cuotas de {fmt(Math.round(mn/cuotas))}</span>
            <span style={{fontSize:12,color:'var(--t2)',marginLeft:8}}>= {fmt(mn)} total</span>
          </div>}
        </>}
      </>}
    </>}
    <button style={{...S.btnP,marginTop:8}} onClick={guardar}>{tipo==='gasto'?'Registrar gasto':'Registrar ingreso'}</button>
  </Modal>;
}

function ModalEditMov({mov,tarjetas,fijos=[],movs=[],onGuardar,onClose,catsCustom={},onAddCat}){
  const esCuota=mov.tipo==='cuota';
  const[tipo,setTipo]=useState(esCuota?'gasto':mov.tipo);const[ent,setEnt]=useState(mov.ent||'negocio');
  const[desc,setDesc]=useState(mov.desc||'');const[monto,setMonto]=useState(esCuota?(mov.montoTotal||''):(mov.monto||''));
  const[fecha,setFecha]=useState(mov.fecha||hoy());const[metodo,setMetodo]=useState(mov.metodo||'efectivo');const[cat,setCat]=useState(mov.cat||'');
  const[catOtros,setCatOtros]=useState('');
  const[vinculoFijo,setVinculoFijo]=useState(mov.fijoId||'');
  const catsKey=tipo==='ingreso'?'ingreso':ent;
  const catsBase=tipo==='ingreso'?CATS.ingreso:(CATS[ent]||[]);
  const cats=[...catsBase.filter(c=>c!=='Otros'),...(catsCustom[catsKey]||[]),'Otros'];

  const mesFijo=mk(fecha);
  const fijoDisponible=f=>f.id===mov.fijoId||!fijoPagado(f,movs,mesFijo)||!fijoPagado(f,movs,nextMesKey(mesFijo));
  const fijosDisponibles=tipo==='gasto'&&!esCuota?fijos.filter(f=>f.activo&&f.entidad===ent&&fijoDisponible(f)):[];
  const descripcionesFrecuentes=(()=>{
    if(tipo!=='gasto'||esCuota)return[];
    const porDesc={};
    (movs||[]).forEach(m=>{
      if(m.tipo!=='gasto'||(m.ent||'personal')!==ent)return;
      const txt=(m.desc||'').trim();if(!txt)return;
      const k=txt.toLowerCase();
      if(!porDesc[k])porDesc[k]={desc:txt,veces:0,cat:m.cat,monto:m.monto,fecha:m.fecha||''};
      porDesc[k].veces++;
      if((m.fecha||'')>=porDesc[k].fecha){porDesc[k].cat=m.cat;porDesc[k].monto=m.monto;porDesc[k].fecha=m.fecha;}
    });
    return Object.values(porDesc)
      .filter(x=>x.veces>=2&&!fijosDisponibles.some(f=>coincideFijo(x.desc,f.nombre)))
      .sort((a,b)=>b.veces-a.veces).slice(0,8);
  })();
  // En edición no se pisan monto/categoría ya cargados: solo se actualiza el vínculo con el fijo.
  const cambiarDesc=v=>{
    setDesc(v);
    if(tipo!=='gasto'||esCuota)return;
    const vTrim=v.trim();
    const matchFijo=vTrim.length>=3?fijosDisponibles.find(f=>coincideFijo(vTrim,f.nombre)):null;
    if(matchFijo){setVinculoFijo(matchFijo.id);return;}
    if(vinculoFijo)setVinculoFijo('');
  };

  const guardar=()=>{
    if(!desc.trim())return alert('Escribí una descripción');
    if(!esCuota&&(!monto||Number(monto)<=0))return alert('Ingresá un monto válido');
    if(cat==='Otros'&&!catOtros.trim())return alert('Escribí el nombre de la nueva categoría');
    const esNuevaCat=cat==='Otros'&&catOtros.trim();
    const cat_final=esNuevaCat?catOtros.trim():cat;
    if(esNuevaCat)onAddCat&&onAddCat(catsKey,cat_final);
    const fijoVinculado=vinculoFijo&&fijosDisponibles.find(f=>f.id===vinculoFijo);
    const camposFijo=tipo==='gasto'&&!esCuota?(fijoVinculado?{fijoId:fijoVinculado.id,fijoMes:primerMesNoPagado(fijoVinculado,movs,fecha)}:{fijoId:null,fijoMes:null}):{};
    if(esCuota){onGuardar({...mov,desc,fecha,cat:cat_final,ent});}else{onGuardar({...mov,tipo,ent,desc,monto:Number(monto),fecha,metodo,cat:cat_final,...camposFijo});}
    onClose();
  };
  return<Modal onClose={onClose} title="✏️ Editar movimiento">
    {esCuota&&<div style={{background:'#fffbeb',border:'0.5px solid #fde68a',borderRadius:10,padding:'10px 14px',fontSize:12,color:'#92400e',marginBottom:14}}>💳 Es una compra en cuotas. Solo podés editar la descripción, fecha y categoría.</div>}
    {!esCuota&&<><div style={{marginBottom:12}}><Toggle opts={[['gasto','💸 Gasto'],['ingreso','💰 Ingreso']]} val={tipo} onChange={setTipo} cm={{gasto:'var(--danger)',ingreso:'var(--success)'}}/></div><div style={{marginBottom:12}}><Toggle opts={[['personal','👤 Personal'],['negocio','💼 Trabajo']]} val={ent} onChange={setEnt} cm={{personal:'var(--pers)',negocio:'var(--neg)'}}/></div></>}
    <label style={S.lbl}>Descripción</label>
    <input style={{...S.inp,marginBottom:8}} value={desc} onChange={e=>cambiarDesc(e.target.value)} placeholder="Ej: Comida, Combustible, Compras..." list={(fijosDisponibles.length>0||descripcionesFrecuentes.length>0)?'desc-edit-dl':undefined}/>
    {(fijosDisponibles.length>0||descripcionesFrecuentes.length>0)&&<datalist id="desc-edit-dl">
      {fijosDisponibles.map(f=><option key={'f-'+f.id} value={f.nombre}>{fmt(f.monto)} · gasto fijo pendiente</option>)}
      {descripcionesFrecuentes.map(x=><option key={'d-'+x.desc} value={x.desc}>{fmt(x.monto)} · usado {x.veces} veces</option>)}
    </datalist>}
    {vinculoFijo?<div style={{background:'#f0fdf4',border:'0.5px solid #bbf7d0',borderRadius:10,padding:'9px 14px',marginBottom:12,fontSize:12,color:'#15803d'}}>✓ Coincide con un gasto fijo — al guardar queda marcado como pagado en Gastos Fijos.</div>:<div style={{marginBottom:12}}/>}
    {!esCuota&&<><label style={S.lbl}>Monto $</label><input style={{...S.inpR,marginBottom:12}} type="number" inputMode="numeric" value={monto} onChange={e=>setMonto(e.target.value)}/></>}
    <label style={S.lbl}>Fecha</label><input style={{...S.inp,marginBottom:12}} type="date" value={fecha} onChange={e=>setFecha(e.target.value)}/>
    <label style={S.lbl}>Categoría</label><select style={{...S.inp,marginBottom:cat==='Otros'?8:12}} value={cat} onChange={e=>{setCat(e.target.value);if(e.target.value!=='Otros')setCatOtros('');}}>{cats.map(c=><option key={c} value={c}>{c}</option>)}</select>
    {cat==='Otros'&&<input style={{...S.inp,marginBottom:12}} value={catOtros} onChange={e=>setCatOtros(e.target.value)} placeholder="Escribí la nueva categoría" autoFocus/>}
    {!esCuota&&<><label style={S.lbl}>Método de pago</label><div style={{display:'flex',gap:6,marginBottom:16,flexWrap:'wrap'}}>{['efectivo','débito','tarjeta','transferencia'].map(mt=><button key={mt} onClick={()=>setMetodo(mt)} style={{padding:'7px 13px',borderRadius:20,border:`1px solid ${metodo===mt?'var(--primary)':'var(--border)'}`,background:metodo===mt?'var(--pdim)':'transparent',color:metodo===mt?'var(--primary)':'var(--t2)',fontSize:12,fontWeight:600,cursor:'pointer'}}>{mt}</button>)}</div></>}
    <button style={S.btnP} onClick={guardar}>Guardar cambios</button>
  </Modal>;
}

/* ══ GRÁFICOS (día/mes/año/general, barras CSS) ══ */
function datosGraficoEC(movs,periodo){
  if(periodo==='dia'){
    const dias=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);dias.push(d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()));}
    return dias.map(f=>{const ms=movs.filter(m=>m.fecha===f);return{label:DIAS_L[new Date(f+'T12:00:00').getDay()].slice(0,2),ingreso:ms.filter(m=>m.tipo==='ingreso').reduce((a,m)=>a+m.monto,0),gasto:ms.filter(m=>m.tipo==='gasto').reduce((a,m)=>a+m.monto,0)};});
  }
  if(periodo==='mes'){
    const y=new Date().getFullYear(),mo=new Date().getMonth();const dias=new Date(y,mo+1,0).getDate();
    const arr=[];for(let d=1;d<=dias;d++){const f=y+'-'+pad(mo+1)+'-'+pad(d);const ms=movs.filter(m=>m.fecha===f);arr.push({label:String(d),ingreso:ms.filter(m=>m.tipo==='ingreso').reduce((a,m)=>a+m.monto,0),gasto:ms.filter(m=>m.tipo==='gasto').reduce((a,m)=>a+m.monto,0)});}
    return arr;
  }
  if(periodo==='anio'){
    const y=new Date().getFullYear();
    return MESES_L.map((nombre,i)=>{const pre=y+'-'+pad(i+1);const ms=movs.filter(m=>m.fecha&&m.fecha.startsWith(pre));return{label:nombre.slice(0,3),ingreso:ms.filter(m=>m.tipo==='ingreso').reduce((a,m)=>a+m.monto,0),gasto:ms.filter(m=>m.tipo==='gasto').reduce((a,m)=>a+m.monto,0)};});
  }
  const anios=[...new Set(movs.filter(m=>m.fecha).map(m=>m.fecha.slice(0,4)))].sort();
  if(anios.length===0)anios.push(String(new Date().getFullYear()));
  return anios.map(a=>{const ms=movs.filter(m=>m.fecha&&m.fecha.startsWith(a));return{label:a,ingreso:ms.filter(m=>m.tipo==='ingreso').reduce((a2,m)=>a2+m.monto,0),gasto:ms.filter(m=>m.tipo==='gasto').reduce((a2,m)=>a2+m.monto,0)};});
}
function GraficoFinanciero({movs}){
  const[periodo,setPeriodo]=useState('dia');
  const datos=useMemo(()=>datosGraficoEC(movs,periodo),[movs,periodo]);
  const max=Math.max(1,...datos.map(d=>Math.max(d.ingreso,d.gasto)));
  const muchos=datos.length>10;
  return<div>
    <div style={{display:'flex',gap:5,marginBottom:14}}>
      {[['dia','Día'],['mes','Mes'],['anio','Año'],['general','General']].map(([v,l])=>{const a=periodo===v;return<button key={v} onClick={()=>setPeriodo(v)} style={{flex:1,padding:'6px 0',borderRadius:20,fontSize:11,fontWeight:600,cursor:'pointer',border:`1px solid ${a?'var(--primary)':'var(--border)'}`,background:a?'var(--pdim)':'transparent',color:a?'var(--primary)':'var(--t2)'}}>{l}</button>;})}
    </div>
    <div style={{display:'flex',alignItems:'flex-end',gap:6,height:110,overflowX:muchos?'auto':'visible',paddingBottom:4}}>
      {datos.map((d,i)=><div key={i} style={{minWidth:muchos?18:0,flex:muchos?'0 0 auto':1,display:'flex',flexDirection:'column',alignItems:'center',gap:4}}>
        <div style={{width:'100%',display:'flex',gap:2,alignItems:'flex-end',height:85}}>
          <div style={{flex:1,background:'var(--success)',borderRadius:'3px 3px 0 0',height:(d.ingreso/max*100)+'%',minHeight:d.ingreso>0?2:0}}/>
          <div style={{flex:1,background:'var(--danger)',borderRadius:'3px 3px 0 0',height:(d.gasto/max*100)+'%',minHeight:d.gasto>0?2:0}}/>
        </div>
        <span style={{fontSize:9,color:'var(--t3)'}}>{d.label}</span>
      </div>)}
    </div>
    <div style={{display:'flex',gap:14,marginTop:10,justifyContent:'center'}}>
      <span style={{fontSize:10,color:'var(--t2)'}}><span style={{display:'inline-block',width:8,height:8,borderRadius:2,background:'var(--success)',marginRight:4}}/>Ingresos</span>
      <span style={{fontSize:10,color:'var(--t2)'}}><span style={{display:'inline-block',width:8,height:8,borderRadius:2,background:'var(--danger)',marginRight:4}}/>Egresos</span>
    </div>
  </div>;
}

/* ══ DASHBOARD ══ */
function Dashboard({movs,fijos,pagos,tarjetas,onNuevo,onVerIngresos,onVerEgresos,onVerArqueo,onVerFijos}){
  const[presup,setPresup]=useState(()=>Number(localStorage.getItem('ec_presupuesto'))||0);
  const[masAbierto,setMasAbierto]=useState(false);
  const[notifAbierto,setNotifAbierto]=useState(false);
  const mesK=mk(hoy());
  const movMes=movs.filter(m=>mk(m.fecha)===mesK);
  const ingresos=movMes.filter(m=>m.tipo==='ingreso').reduce((a,m)=>a+m.monto,0);
  const gastosVar=movMes.filter(m=>m.tipo==='gasto').reduce((a,m)=>a+m.monto,0);
  const cuotasMes=movs.filter(m=>m.tipo==='cuota'&&(m.venc||[]).some(v=>mk(v)===mesK));
  const totCuotas=cuotasMes.reduce((a,m)=>a+m.montoCuota,0);
  // Antes esto se calculaba con la colección "pagos"/"pagosFijos", que nunca se llenaba en ningún
  // lado — por eso el Dashboard mostraba TODOS los gastos fijos como pendientes aunque ya estuvieran
  // pagados. Se corrige usando la misma fuente que la pantalla de Gastos Fijos (los movimientos ya
  // vinculados con fijoId+fijoMes).
  const fijosPend=fijos.filter(f=>f.activo&&!fijoPagado(f,movs,mesK));
  const totPend=fijosPend.reduce((a,f)=>a+f.monto,0);
  const compartirResumen=async()=>{
    const texto=`📊 Resumen de ${mlabel(mesK)} — Emma Control\n\n`+
      `↑ Ingresos: ${fmt(ingresos)}\n`+
      `↓ Egresos: ${fmt(gastosVar)}\n`+
      `💰 Balance: ${fmt(ingresos-gastosVar)}`+
      (totPend>0?`\n📌 Fijos pendientes: ${fmt(totPend)}`:'');
    if(navigator.share){
      try{await navigator.share({title:'Resumen '+mlabel(mesK),text:texto});}catch(e){}
    }else if(navigator.clipboard){
      try{await navigator.clipboard.writeText(texto);alert('📋 Resumen copiado al portapapeles');}catch(e){alert(texto);}
    }else alert(texto);
  };
  const totEgresos=gastosVar;
  const balance=ingresos-totEgresos;
  const cb=balance>=0?'var(--success)':'var(--danger)';
  const anioActual=new Date().getFullYear().toString();
  const movAnio=movs.filter(m=>m.fecha&&m.fecha.startsWith(anioActual));
  const ingAnio=movAnio.filter(m=>m.tipo==='ingreso').reduce((a,m)=>a+m.monto,0);
  const gasAnio=movAnio.filter(m=>m.tipo==='gasto').reduce((a,m)=>a+m.monto,0);
  const balAnio=ingAnio-gasAnio;
  const venc=[];
  movs.filter(m=>m.tipo==='cuota').forEach(m=>(m.venc||[]).forEach((v,i)=>{const d=dh(v);if(d>=0&&d<=14)venc.push({label:`${m.desc} (${i+1}/${m.cuotas})`,monto:m.montoCuota,d,ico:'💳'});}));
  fijosPend.forEach(f=>{const[y,mo]=hoy().split('-');const fv=`${y}-${mo}-${pad(f.diaVenc)}`;const d=dh(fv);if(d>=-2&&d<=14)venc.push({label:f.nombre,monto:f.monto,d,ico:'📌'});});
  venc.sort((a,b)=>a.d-b.d);
  // La campanita de "Más detalles" se enciende cuando algo vence hoy, ya venció, o vence
  // mañana (1 día antes) — así se ve sin tener que desplegar toda la lista.
  const vencUrgentes=venc.filter(v=>v.d<=1);
  return<div style={S.scr}>
    <div style={{padding:'14px 14px 0'}}>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:12}}>
        <div onClick={onVerIngresos} style={{...S.card2,cursor:'pointer',borderColor:'var(--sborder)',background:'#f0fdf4'}}>
          <div style={{fontSize:9,color:'#166534',fontWeight:700,marginBottom:3,textTransform:'uppercase',letterSpacing:'0.05em'}}>↑ Ingresos</div>
          <div style={{fontFamily:'var(--fn)',fontSize:17,fontWeight:700,color:'#16a34a',letterSpacing:'-0.02em'}}>{fmt(ingresos)}</div>
          <div style={{fontSize:10,color:'#4ade80',marginTop:3}}>Ver detalle →</div>
        </div>
        <div onClick={onVerEgresos} style={{...S.card2,cursor:'pointer',borderColor:'var(--dborder)',background:'#fef2f2'}}>
          <div style={{fontSize:9,color:'#991b1b',fontWeight:700,marginBottom:3,textTransform:'uppercase',letterSpacing:'0.05em'}}>↓ Egresos</div>
          <div style={{fontFamily:'var(--fn)',fontSize:17,fontWeight:700,color:'#dc2626',letterSpacing:'-0.02em'}}>{fmt(totEgresos)}</div>
          <div style={{fontSize:10,color:'#f87171',marginTop:3}}>Ver detalle →</div>
        </div>
      </div>

      <div style={{...S.card2,marginBottom:12,background:balance>=0?'var(--sdim)':'var(--ddim)',borderColor:balance>=0?'var(--sborder)':'var(--dborder)'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
          <span style={{fontSize:9,color:'var(--t2)',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.05em'}}>Balance del mes</span>
          <button onClick={compartirResumen} aria-label="Compartir resumen" style={{background:'rgba(0,0,0,0.06)',border:'none',color:'var(--t2)',fontSize:12,cursor:'pointer',width:24,height:24,borderRadius:7,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>📤</button>
        </div>
        <div style={{fontFamily:'var(--fn)',fontSize:17,fontWeight:700,color:cb,marginTop:3,letterSpacing:'-0.02em'}}>{fmt(balance)}</div>
      </div>

      <div onClick={onVerArqueo} style={{...S.card,cursor:'pointer',background:'var(--pdim)',border:'0.5px solid var(--pborder)',marginBottom:12}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>

    <div style={{padding:'12px 14px 0'}}>
      <div style={{display:'flex',gap:8,marginBottom:12}}>{[['Ingresos',totI,'#16a34a'],['Gastos',totG,'#dc2626'],['Balance',totI-totG,(totI-totG)>=0?'#16a34a':'#dc2626']].map(([l,v,c])=><div key={l} style={{flex:1,...S.card2,textAlign:'center',padding:'10px 6px'}}><div style={{fontSize:9,color:'var(--t2)',marginBottom:3,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.04em'}}>{l}</div><div style={{fontFamily:'var(--fn)',fontSize:13,fontWeight:700,color:c}}>{fmt(v)}</div></div>)}</div>
      {lista.length===0&&<div style={{textAlign:'center',padding:'30px 0',color:'var(--t3)',fontSize:14}}>Sin movimientos en este período</div>}
      {dias.map((dia,i)=><div key={dia}>
        {i>0&&<div style={{height:'1.5px',background:'var(--border)',margin:'12px 0 0'}}/>}
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'12px 0 8px'}}>
          <div style={{fontFamily:'var(--fh)',fontSize:17,fontWeight:800,color:'var(--text)',letterSpacing:'-0.01em'}}>{fechaLarga(dia)}</div>
          <div style={{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:2}}>{(()=>{const di=porDia[dia].filter(m=>m.tipo==='ingreso').reduce((a,m)=>a+m.monto,0);const dg=porDia[dia].filter(m=>m.tipo==='gasto').reduce((a,m)=>a+m.monto,0);return[di>0&&<span key='i' style={{fontFamily:'var(--fn)',fontSize:12,fontWeight:700,color:'#16a34a'}}>+{fmt(di)}</span>,dg>0&&<span key='g' style={{fontFamily:'var(--fn)',fontSize:12,fontWeight:700,color:'#dc2626'}}>-{fmt(dg)}</span>];})()}</div>
        </div>
        {porDia[dia].map(m=><div key={m.id} style={{...S.card,marginBottom:8,display:'flex',alignItems:'center',gap:10,...(esRedondeo(m.desc)?{background:'rgba(245,158,11,0.12)',border:'1.5px solid #f59e0b'}:{})}}>
          <div style={{width:36,height:36,borderRadius:10,background:m.tipo==='ingreso'?'#f0fdf4':'#fef2f2',border:`0.5px solid ${m.tipo==='ingreso'?'#bbf7d0':'#fecaca'}`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:16,flexShrink:0}}>{esRedondeo(m.desc)?'🔄':(m.tipo==='ingreso'?'💰':icoM[m.metodo]||'💸')}</div>
          <div style={{flex:1,minWidth:0}}><div style={{fontSize:14,fontWeight:500,color:'var(--text)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{m.desc}</div><div style={{display:'flex',gap:5,marginTop:2,flexWrap:'wrap',alignItems:'center'}}><ChipP t={m.ent} sm/>{m.cat&&<span style={{fontSize:10,color:'var(--t3)'}}>{m.cat}</span>}</div></div>
          <div style={{display:'flex',alignItems:'center',gap:6,flexShrink:0}}>
            <div style={{fontFamily:'var(--fn)',fontWeight:700,fontSize:15,color:m.tipo==='ingreso'?'#16a34a':'#dc2626'}}>{m.tipo==='ingreso'?'+':'-'}{fmt(m.monto)}</div>
            <button onClick={()=>onEditar(m)} style={{background:'var(--pdim)',border:'none',color:'var(--primary)',fontSize:13,cursor:'pointer',padding:'5px 7px',borderRadius:8}}>✏️</button>
            <button onClick={()=>onEliminar(m.id)} style={{background:'#fef2f2',border:'none',color:'#dc2626',fontSize:14,cursor:'pointer',padding:'4px 7px',borderRadius:8}}>🗑️</button>
          </div>
        </div>)}
      </div>)}
    </div>
    <FAB onClick={()=>onNuevo()}/>
  </div>;
}

/* ══ TARJETAS ══ */
function Tarjetas({tarjetas,movs,onAgregar,onEditar,onEliminar,onSaldarCuota,onEliminarCuota,onPagarCuota}){
  const mes=mk(hoy());const[exp,setExp]=useState(null);
  const deuda=useMemo(()=>movs.filter(m=>m.tipo==='cuota'&&!m.saldada).reduce((a,m)=>{const r=(m.venc||[]).filter(v=>dh(v)>=0).length;return a+r*m.montoCuota;},0),[movs]);
  const pendXT=useMemo(()=>{const r={};movs.filter(m=>m.tipo==='cuota'&&!m.saldada).forEach(m=>{const rest=(m.venc||[]).filter(v=>dh(v)>=0).length;if(rest>0){(r[m.tarjetaId]=r[m.tarjetaId]||[]).push({...m,rest,restMonto:rest*m.montoCuota});}});return r;},[movs]);
  const orphan=useMemo(()=>{const ids=new Set(tarjetas.map(t=>t.id));return movs.filter(m=>m.tipo==='cuota'&&!m.saldada&&!ids.has(m.tarjetaId)).map(m=>{const rest=(m.venc||[]).filter(v=>dh(v)>=0).length;return{...m,rest,restMonto:rest*m.montoCuota};}).filter(m=>m.rest>0);},[movs,tarjetas]);
  const cxT=useMemo(()=>{const r={};movs.filter(m=>m.tipo==='cuota'&&!m.saldada).forEach(m=>{if(!r[m.tarjetaId])r[m.tarjetaId]=[];const i=(m.venc||[]).findIndex(v=>mk(v)===mes);if(i>=0)r[m.tarjetaId].push({...m,ca:i+1});});return r;},[movs,mes]);
  return<div style={S.scr}>
    <div style={{padding:'14px 16px 12px',background:'var(--card)',borderBottom:'0.5px solid var(--border)',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
      <span style={{fontFamily:'var(--fh)',fontSize:18,fontWeight:800,color:'var(--text)'}}>Tarjetas</span>

    </div>
    <div style={{padding:'14px 14px 0'}}>
      {deuda>0&&<div style={{...S.card,background:'#fef2f2',border:'0.5px solid #fecaca',marginBottom:14,textAlign:'center'}}><div style={{fontSize:11,color:'#991b1b',marginBottom:4}}>Deuda total en cuotas restantes</div><div style={{fontFamily:'var(--fh)',fontSize:26,fontWeight:800,color:'#dc2626'}}>{fmt(deuda)}</div></div>}
      {orphan.length>0&&<div style={{...S.card,marginBottom:14,borderLeft:'3px solid #dc2626'}}>
        <div style={{fontSize:11,color:'var(--t2)',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.04em',marginBottom:2}}>Cuotas sin tarjeta</div>
        <div style={{fontSize:11,color:'var(--t3)',marginBottom:8}}>Pertenecen a una tarjeta que ya no existe. Saldalas o eliminalas para sacarlas de la deuda.</div>
        {orphan.map(c=><div key={c.id} style={{...S.row,borderTop:'0.5px solid var(--border)',display:'flex',justifyContent:'space-between',alignItems:'center',gap:8}}>
          <div style={{minWidth:0,flex:1}}><div style={{fontSize:13,fontWeight:500,color:'var(--text)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{c.desc||'Cuota'}</div><div style={{fontSize:11,color:'var(--t3)'}}>{c.rest} {c.rest===1?'cuota restante':'cuotas restantes'} · {fmt(c.restMonto)}</div></div>
          <button onClick={()=>onSaldarCuota(c.id)} style={{...S.btn,fontSize:11,padding:'6px 9px',color:'#16a34a',borderColor:'var(--sborder)',flexShrink:0}}>Saldar</button>
          <button onClick={()=>onEliminarCuota(c.id)} style={{...S.btn,fontSize:14,padding:'6px 8px',color:'#dc2626',flexShrink:0}}>🗑</button>
        </div>)}
      </div>}
      {tarjetas.length===0&&<div style={{textAlign:'center',padding:'50px 0',color:'var(--t3)'}}><div style={{fontSize:44,marginBottom:10}}>💳</div><div style={{fontSize:15,fontWeight:500,color:'var(--t2)',marginBottom:6}}>Sin tarjetas</div><div style={{fontSize:13}}>Tocá + Agregar para empezar</div></div>}
      {tarjetas.map(t=>{const ct=cxT[t.id]||[];const pt=pendXT[t.id]||[];const tm=ct.reduce((a,c)=>a+c.montoCuota,0);const isE=exp===t.id;
        return<div key={t.id} style={{marginBottom:14}}>
          <div style={{background:t.color||'#1e3a5f',borderRadius:16,padding:'18px 20px 16px',marginBottom:4,position:'relative',overflow:'hidden'}}>
            <div style={{position:'absolute',right:-20,top:-20,width:100,height:100,borderRadius:'50%',background:'rgba(255,255,255,0.06)'}}/>
            <div style={{fontSize:10,color:'rgba(255,255,255,0.5)',textTransform:'uppercase'}}>{t.banco||'Banco'}</div>
            <div style={{fontFamily:'var(--fh)',fontSize:17,fontWeight:700,color:'#fff',margin:'6px 0 14px'}}>{t.nombre}</div>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end'}}>
              <div style={{fontFamily:'monospace',fontSize:14,color:'rgba(255,255,255,0.7)',letterSpacing:'0.12em'}}>·· {t.ultimos4||'····'}</div>
              <div style={{textAlign:'right'}}>{t.diaCierre?<div style={{fontSize:10,color:'rgba(255,255,255,0.45)'}}>Cierra día {t.diaCierre}</div>:null}{t.diaVenc?<div style={{fontSize:10,color:'rgba(255,255,255,0.45)'}}>Vence día {t.diaVenc}</div>:null}</div>
            </div>
          </div>
          <div style={S.card}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:isE&&pt.length?10:0}}>
              <div><div style={{fontSize:11,color:'var(--t2)',marginBottom:2}}>Este mes</div><div style={{fontFamily:'var(--fh)',fontSize:20,fontWeight:800,color:tm>0?'#dc2626':'var(--t3)'}}>{tm>0?fmt(tm):'$0'}</div></div>
              <div style={{display:'flex',gap:6}}>
                {pt.length>0&&<button onClick={()=>setExp(isE?null:t.id)} style={{...S.btn,fontSize:11,padding:'6px 10px'}}>{isE?'Ocultar':'Cuotas ('+pt.length+')'}</button>}
                <button onClick={()=>onEditar(t)} style={{...S.btn,fontSize:13,padding:'7px 10px'}}>✏️</button>
                <button onClick={()=>onEliminar(t.id)} style={{...S.btn,color:'#dc2626',fontSize:13,padding:'7px 10px'}}>✕</button>
              </div>
            </div>
            {isE&&pt.map(c=><div key={c.id} style={{...S.row,borderTop:'0.5px solid var(--border)',display:'flex',justifyContent:'space-between',alignItems:'center',gap:8}}><div style={{minWidth:0,flex:1}}><div style={{fontSize:13,fontWeight:500,color:'var(--text)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{c.desc}</div><div style={{fontSize:11,color:'var(--t3)'}}>{c.rest} {c.rest===1?'cuota restante':'cuotas restantes'} · {fmt(c.restMonto)}</div></div><button onClick={()=>onPagarCuota(c)} style={{...S.btn,fontSize:11,padding:'6px 9px',color:'var(--primary)',borderColor:'var(--pborder)',flexShrink:0}}>Pagar</button><button onClick={()=>onSaldarCuota(c.id)} style={{...S.btn,fontSize:11,padding:'6px 9px',color:'#16a34a',borderColor:'var(--sborder)',flexShrink:0}}>Saldar</button><button onClick={()=>onEliminarCuota(c.id)} style={{...S.btn,fontSize:14,padding:'6px 8px',color:'#dc2626',flexShrink:0}}>🗑</button></div>)}
          </div>
        </div>;
      })}
    </div>
  </div>;
}

/* ══ GASTOS FIJOS ══ */
function GastosFijos({fijos,movs,setMovs,onAgregar,onEditar,onEliminar,mostrarDeshacer}){
  const mes=mk(hoy());const[filtro,setFiltro]=useState('todos');
  const[ignorados,setIgnorados]=useState(()=>new Set());
  const pagado=f=>fijoPagado(f,movs,mes);
  // Compara los gastos ya cargados a mano en Movimientos contra los fijos pendientes: si hay uno
  // sin vincular, del mismo tipo de entidad, cargado este mes o el anterior (para cubrir pagos
  // adelantados), y cuya descripción coincide con el nombre del fijo, se sugiere vincularlo en
  // vez de tener que abrirlo y editarlo a mano.
  const sugerenciaFijo=f=>{
    const mesAnterior=(()=>{const[y,m]=mes.split('-').map(Number);const d=new Date(y,m-2,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');})();
    return(movs||[]).find(m=>{
      if(m.tipo!=='gasto'||m.fijoId||ignorados.has(m.id))return false;
      if((m.ent||'personal')!==f.entidad)return false;
      const mesM=mk(m.fecha);if(mesM!==mes&&mesM!==mesAnterior)return false;
      return coincideFijo(m.desc,f.nombre);
    })||null;
  };
  const vincularSugerencia=(f,m)=>setMovs(prev=>prev.map(x=>x.id===m.id?{...x,fijoId:f.id,fijoMes:primerMesNoPagado(f,movs,m.fecha)}:x));
  const ignorarSugerencia=m=>setIgnorados(prev=>new Set(prev).add(m.id));
  const totF=fijos.filter(f=>f.activo).reduce((a,f)=>a+f.monto,0);
  const totP=fijos.filter(f=>f.activo&&pagado(f)).reduce((a,f)=>a+f.monto,0);
  const totPend=fijos.filter(f=>f.activo&&!pagado(f)).reduce((a,f)=>a+f.monto,0);
  const toggle=f=>{
    if(pagado(f)){
      const cant=(movs||[]).filter(m=>m.fijoId===f.id&&m.fijoMes===mes).length;
      if(!window.confirm(`¿Desmarcar "${f.nombre}" como pagado? Se va a borrar el movimiento de gasto vinculado${cant>1?` (${cant} registros)`:''}.`))return;
      const borrados=(movs||[]).filter(m=>m.fijoId===f.id&&m.fijoMes===mes);
      setMovs(prev=>prev.filter(m=>!(m.fijoId===f.id&&m.fijoMes===mes)));
      if(mostrarDeshacer)mostrarDeshacer(`Pago de "${f.nombre}" desmarcado`,()=>setMovs(prev=>[...prev,...borrados]));
    }else{
      const val=window.prompt(`¿Cuánto pagaste de "${f.nombre}"? (de referencia: ${fmt(f.monto)})`,f.monto);
      if(val===null)return;
      const montoReal=Math.round(Number(val));
      if(!montoReal||montoReal<=0)return alert('Ingresá un monto válido');
      const mesPago=primerMesNoPagado(f,movs,hoy());
      const esAdelanto=mesPago!==mes;
      if(!window.confirm(`¿Confirmás el pago de ${f.nombre} (${fmt(montoReal)})${esAdelanto?' como adelanto del próximo mes':''}? Se registra como gasto.`))return;
      setMovs(prev=>[...prev,{id:uid2(),tipo:'gasto',desc:f.nombre,monto:montoReal,fecha:hoy(),cat:f.cat||'Gasto fijo',ent:f.entidad||'personal',fijoId:f.id,fijoMes:mesPago}]);
    }
  };
  const lista=fijos.filter(f=>filtro==='todos'||f.entidad===filtro);
  const getD=f=>{const[y,mo]=hoy().split('-');return dh(`${y}-${mo}-${pad(f.diaVenc)}`);};
  const bc=(f,pag)=>{if(pag)return'var(--primary)';const d=getD(f);return d<=0?'#dc2626':d<=5?'#d97706':'var(--border)';};
  return<div style={S.scr}>
    <div style={{padding:'14px 16px 12px',background:'var(--card)',borderBottom:'0.5px solid var(--border)',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
      <span style={{fontFamily:'var(--fh)',fontSize:18,fontWeight:800,color:'var(--text)'}}>Gastos fijos</span>
      <button onClick={onAgregar} style={{...S.btn,background:'var(--primary)',color:'#fff',border:'none',fontWeight:700}}>+ Agregar</button>
    </div>
    <div style={{padding:'14px 14px 0'}}>
      <div style={{display:'flex',gap:8,marginBottom:14}}>{[['Total',totF,'var(--text)'],['Pagado',totP,'#16a34a'],['Pendiente',totPend,'#d97706']].map(([l,v,c])=><div key={l} style={{flex:1,...S.card2,textAlign:'center',padding:'10px 6px'}}><div style={{fontSize:9,color:'var(--t2)',marginBottom:3,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.04em'}}>{l}</div><div style={{fontFamily:'var(--fn)',fontSize:14,fontWeight:700,color:c}}>{fmt(v)}</div></div>)}</div>
      <div style={{display:'flex',gap:6,marginBottom:12}}>{[['todos','Todos'],['personal','Personal'],['negocio','Trabajo']].map(([v,l])=><button key={v} onClick={()=>setFiltro(v)} style={{flex:1,padding:'7px 0',borderRadius:20,fontSize:12,fontWeight:600,cursor:'pointer',border:`1px solid ${filtro===v?'var(--primary)':'var(--border)'}`,background:filtro===v?'var(--pdim)':'transparent',color:filtro===v?'var(--primary)':'var(--t2)'}}>{l}</button>)}</div>
      {lista.length===0&&<div style={{textAlign:'center',padding:'30px 0',color:'var(--t3)',fontSize:14}}>Sin gastos fijos</div>}
      {lista.map(f=>{const pag=pagado(f);const d=getD(f);const sug=!pag?sugerenciaFijo(f):null;
        return<div key={f.id} style={{...S.card,marginBottom:10,borderLeft:`3px solid ${bc(f,pag)}`,opacity:pag?0.8:1}}>
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <div style={{flex:1,minWidth:0}}>
              <div style={{display:'flex',gap:6,alignItems:'center',marginBottom:3}}><span style={{fontSize:14,fontWeight:600,color:'var(--text)'}}>{f.nombre}</span><ChipP t={f.entidad} sm/></div>
              <div style={{fontSize:11,color:'var(--t3)'}}>Día {f.diaVenc} · {f.cat}</div>
              {!pag&&<div style={{fontSize:11,color:bc(f,pag),marginTop:1,fontWeight:500}}>{d<0?`Venció hace ${-d}d`:d===0?'¡Hoy!':d===1?'Mañana':`En ${d} días`}</div>}
            </div>
            <div style={{display:'flex',alignItems:'center',gap:6,flexShrink:0}}>
              <span style={{fontSize:15,fontWeight:700,color:pag?'#16a34a':'var(--text)'}}>{fmt(f.monto)}</span>
              <button onClick={()=>toggle(f)} style={{padding:'7px 10px',borderRadius:10,border:`1px solid ${pag?'#bbf7d0':'var(--border)'}`,fontSize:12,fontWeight:700,cursor:'pointer',background:pag?'#f0fdf4':'var(--card2)',color:pag?'#16a34a':'var(--t2)'}}>{pag?'✓ Pagado':'Pagar'}</button>
              <button onClick={()=>onEditar(f)} style={{background:'none',border:'none',color:'var(--t3)',fontSize:15,cursor:'pointer'}}>✏️</button>
              <button onClick={()=>onEliminar(f.id)} style={{background:'none',border:'none',color:'var(--t3)',fontSize:15,cursor:'pointer'}}>✕</button>
            </div>
          </div>
          {sug&&<div style={{marginTop:10,paddingTop:10,borderTop:'0.5px solid var(--border)'}}>
            <div style={{fontSize:12,color:'var(--t2)',marginBottom:7}}>💡 Ya cargaste <b style={{color:'var(--text)'}}>"{sug.desc}"</b> el {fechaLarga(sug.fecha)} ({fmt(sug.monto)}). ¿Es el pago de este fijo?</div>
            <div style={{display:'flex',gap:8}}>
              <button onClick={()=>vincularSugerencia(f,sug)} style={{flex:1,padding:'7px 0',borderRadius:10,border:'none',background:'var(--primary)',color:'#fff',fontSize:12,fontWeight:700,cursor:'pointer'}}>Sí, es este pago</button>
              <button onClick={()=>ignorarSugerencia(sug)} style={{padding:'7px 14px',borderRadius:10,border:'1px solid var(--border)',background:'transparent',color:'var(--t2)',fontSize:12,fontWeight:600,cursor:'pointer'}}>No</button>
            </div>
          </div>}
        </div>;
      })}
    </div>
  </div>;
}

/* ══ ARQUEO ══ */
function Arqueo({movs,onVolver}){
  const anio=new Date().getFullYear();
  const[efectivoReal,setEfectivoReal]=useState('');const[mostrarRes,setMostrarRes]=useState(false);
  const movAnio=movs.filter(m=>m.fecha&&m.fecha.startsWith(anio));
  const ingAnio=movAnio.filter(m=>m.tipo==='ingreso').reduce((a,m)=>a+m.monto,0);
  const gasAnio=movAnio.filter(m=>m.tipo==='gasto').reduce((a,m)=>a+m.monto,0);
  const balanceAnio=ingAnio-gasAnio;
  const meses={};
  movAnio.forEach(m=>{const mes=m.fecha.slice(0,7);if(!meses[mes])meses[mes]={ing:0,gas:0};if(m.tipo==='ingreso')meses[mes].ing+=m.monto;else if(m.tipo==='gasto')meses[mes].gas+=m.monto;});
  const diferencia=efectivoReal?Number(efectivoReal)-balanceAnio:null;
  return<div style={S.scr}>
    <div style={{padding:'14px 16px 12px',background:'var(--card)',borderBottom:'0.5px solid var(--border)'}}>
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:4}}>
        <button onClick={onVolver} style={{background:'var(--pdim)',border:'none',color:'var(--primary)',fontSize:'1.1rem',cursor:'pointer',width:34,height:34,borderRadius:10,display:'flex',alignItems:'center',justifyContent:'center'}}>←</button>
        <span style={{fontFamily:'var(--fh)',fontSize:'1.1rem',fontWeight:800,color:'var(--text)'}}>Arqueo {anio}</span>
      </div>
    </div>
    <div style={{padding:'14px 14px 0'}}>
      <div style={{...S.card,marginBottom:12}}>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:12}}>
          <div style={{background:'var(--sdim)',borderRadius:12,padding:'13px 12px',border:'0.5px solid var(--sborder)'}}><div style={{fontSize:'0.65rem',color:'var(--success)',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.03em',marginBottom:5}}>↑ Ingresos</div><div style={{fontFamily:'var(--fh)',fontSize:'1.5rem',fontWeight:800,color:'var(--success)',letterSpacing:'-0.02em',fontFamily:'var(--fn)'}}>{fmt(ingAnio)}</div></div>
          <div style={{background:'var(--ddim)',borderRadius:12,padding:'13px 12px',border:'0.5px solid var(--dborder)'}}><div style={{fontSize:'0.65rem',color:'var(--danger)',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.03em',marginBottom:5}}>↓ Egresos</div><div style={{fontFamily:'var(--fh)',fontSize:'1.5rem',fontWeight:800,color:'var(--danger)',letterSpacing:'-0.02em',fontFamily:'var(--fn)'}}>{fmt(gasAnio)}</div></div>
        </div>

function BioToggle(){

  useEffect(()=>{bioDisponible().then(setDisp);},[]);
  const activar=async()=>{if(!await bioDisponible()){alert('Este dispositivo no tiene lector de huella o Face ID.');return;}try{const cred=await bioRegistrar();localStorage.setItem('ec_bio_cred',cred);localStorage.setItem('ec_bio_on','1');setOn(true);alert('✅ Listo. La próxima vez que abras la app vas a poder entrar con la huella (el PIN sigue de respaldo).');}catch(e){alert('No se pudo registrar la huella. Probá de nuevo.');}};
  const desactivar=()=>{if(!window.confirm('¿Desactivar el desbloqueo con huella?'))return;localStorage.removeItem('ec_bio_on');localStorage.removeItem('ec_bio_cred');setOn(false);};

}
